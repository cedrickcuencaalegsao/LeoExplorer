[package]
name = "cache"
version = "0.1.0"
edition = "2024"

[dependencies]
shared = { path = "../shared" }
base_path = { path = "../base_path" }
once_cell = "1"
num_cpus = "1.17"
# threadpool = "1.8"
tokio = { version = "1", features = ["full"] }
rayon = "1.10.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1.3"
zstd = { version = "0.13.3", features = ["zstdmt"] }
log = "0.4"