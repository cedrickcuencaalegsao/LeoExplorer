[package]
name = "LeoExplorer"
version = "0.1.0"
edition = "2024"

[workspace]
members = [
    "base_path",
    "bootstrap",
    "cache",
    "drive",
    "leoexplorer-gui",
    "leoexplorer_setup",
    "os",
    "shared",
    "system",
]

[dependencies]
leoexplorer-gui = { path = "leoexplorer-gui" }
cache = { path = "cache" }
shared = { path = "shared" }
system = { path = "system" }
bootstrap = { path = "bootstrap" }
iced = "0.13.0"
env_logger = "0.11"
log = "0.4"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
