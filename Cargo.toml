[package]
name = "LeoExplorer"
version = "0.1.0"
edition = "2024"

[workspace]
members = ["base_path","leoexplorer-gui", "os", "shared", "system"]

[dependencies]
leoexplorer-gui = { path = "leoexplorer-gui" }
iced = "0.13.0"
env_logger = "0.11"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
